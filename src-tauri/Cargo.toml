[package]
name = "codex-agent-switch"
version = "0.1.0"
description = "Codex multi-agent model binding manager"
authors = ["Codex Agent Switch contributors"]
edition = "2024"

[workspace]
members = ["cas-helper", "crates/cas-secret-store"]
resolver = "3"

[lib]
name = "codex_agent_switch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cas-secret-store = { path = "crates/cas-secret-store" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
toml_edit = "0.23"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }
